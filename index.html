<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NextTask">
  <title>NextTask</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LEARNING TASK NAVIGATOR</div>
        <h1>NextTask</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙️</button>
    </header>

    <section class="cycle-bar">
      <div>
        <div class="cycle-kicker">DAILY CYCLE</div>
        <div id="cycleStatus" class="cycle-status">活動中</div>
        <div id="cycleDetail" class="cycle-detail"></div>
      </div>
      <div class="cycle-actions">
        <button id="wakeBtn" class="cycle-btn wake">☀️ 起床</button>
        <button id="sleepBtn" class="cycle-btn sleep">🌙 就寝</button>
      </div>
    </section>

    <section id="runningCard" class="running hidden">
      <div class="running-label">▶ いま実行中</div>
      <h2 id="runningName"></h2>
      <div class="running-meta" id="runningMeta"></div>
      <div class="running-actions">
        <button id="completeBtn" class="primary">✓ 完了</button>
        <button id="skipBtn" class="secondary">↷ スキップ</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <div class="section-kicker">NEXT MOVE</div>
          <h2>次に何をする？</h2>
        </div>
        <div id="contextLabel" class="context-pill"></div>
      </div>

      <div id="cards" class="cards"></div>
      <button id="showMoreBtn" class="text-btn">ほかの候補を見る</button>
    </section>

    <section class="quick-add">
      <input id="quickTask" type="text" maxlength="60" placeholder="新しいタスクを追加…">
      <button id="quickAddBtn">＋</button>
    </section>

    <section class="learning-panel">
      <div class="section-head compact">
        <div>
          <div class="section-kicker">LEARNING</div>
          <h2>学習状況</h2>
        </div>
        <div id="learningCount" class="count-badge">0</div>
      </div>

      <div class="metrics">
        <div class="metric"><strong id="mSelections">0</strong><span>選択</span></div>
        <div class="metric"><strong id="mCompletes">0</strong><span>完了</span></div>
        <div class="metric"><strong id="mSkips">0</strong><span>スキップ</span></div>
      </div>

      <div id="ngramStatus" class="ngram-status"></div>
      <div id="learnInsight" class="insight">まだ学習データがありません。</div>
    </section>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head">
        <h2>設定・タスク管理</h2>
        <button class="icon-btn" value="cancel" aria-label="閉じる">✕</button>
      </div>

      <label class="label">タスク名</label>
      <div class="add-row">
        <input id="taskName" maxlength="60" placeholder="例：風呂に入る">
        <select id="taskPriority" aria-label="優先度">
          <option value="1">優先度 低</option>
          <option value="2" selected>優先度 中</option>
          <option value="3">優先度 高</option>
        </select>
        <button id="addTaskBtn" type="button" class="primary">追加</button>
      </div>

      <section class="bulk-add">
        <div class="bulk-head">
          <div>
            <div class="section-kicker">AI BULK ADD</div>
            <h3>AIから一括追加</h3>
          </div>
          <button id="copyBulkPromptBtn" type="button" class="secondary mini-btn">AI用依頼文をコピー</button>
        </div>
        <textarea id="bulkTasks" rows="7" placeholder="- ゴミを捨てる
- [高] 風呂に入る
- [低] 本を10分読む"></textarea>
        <div class="bulk-hint">1行1タスク。Markdownの箇条書きや番号は自動で除去します。優先度は [高] / [中] / [低] が使えます。</div>
        <button id="importBulkBtn" type="button" class="primary bulk-btn">まとめて追加</button>
      </section>

      <div id="taskList" class="task-list"></div>

      <div class="dialog-actions">
        <button id="exportBtn" type="button" class="secondary">データを書き出す</button>
        <button id="resetBtn" type="button" class="danger">初期化</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="./app.js"></script>
</body>
</html>
